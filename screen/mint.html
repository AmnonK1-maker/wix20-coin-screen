<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Coin Mint v2</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent}
  body:not(.panel){background:#e199db;display:flex;align-items:center;justify-content:center}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/people/people.js"></script>
<script type="module">
// v2 mint: a flat, graphic press (drawn in 2D, no camera, no blank fed in). Each cycle the press comes down, lifts,
// and the struck coin is there on the lower punch; the coin itself is drawn by the wall (one 3D coin, from the die out into the wall).
import { C, colorFor, drawBackdrop, layout, PRESS, BOX, BOX_LINE, OX, under, BG } from './v2-style.js';
import { MILESTONES } from './milestones.js';
const Q=new URLSearchParams(location.search), PANEL=Q.has('panel');
if(PANEL) document.body.classList.add('panel');
// screen size of the whole office frame; this page covers only the press box
const FW=+Q.get('fw')||2320, FH=+Q.get('fh')||Math.round(FW*880/2320);
const L=layout(FW,FH), s=L.s, B=L.box;
const cv=document.getElementById('c'); let x=cv.getContext('2d');
cv.width=Math.round(B.w); cv.height=Math.round(B.h);
if(!PANEL){ const k=Math.min(innerWidth/B.w, innerHeight/B.h)*0.9; cv.style.width=B.w*k+'px'; cv.style.height=B.h*k+'px'; }
const SPEED=+(Q.get('speed')??1);

// press parts, in reference px (absolute frame coords). cx/r: centre + half width; white: x where the lit white side starts;
// yT/ryT: top edge + top-face ellipse (0 = hidden); yB/ryB: bottom edge + its curve
const {UP, LOW, OPEN, HIT}=PRESS;
// the frame's grunge overlay (office.html) lightens everything under it; the press colours are pre-darkened so they
// come out as the Figma's (green 37,190,114 / orange 252,117,13 / blue 72,130,232) once the overlay is on
const UNDER=Q.has('raw')? (h=>h) : under;
addEventListener('message', e=>{ if(e.data?.type==='bg' && e.data.bg) Object.assign(BG, e.data.bg); });   // office: press C, background colour
function capOf(p,yT){ x.beginPath(); x.ellipse(p.cx,yT,p.r,p.ryT,0,0,Math.PI*2); x.fillStyle=UNDER(p.top); x.fill(); }
function part(p, dy=0){   // the ram's grain follows it (dy)
  const yT=p.yT+dy, yB=p.yB+dy, l=p.cx-p.r, rr=p.cx+p.r;
  x.beginPath(); x.moveTo(l,yT);
  if(p.ryT) x.ellipse(p.cx,yT,p.r,p.ryT,0,Math.PI,0,false); else x.lineTo(rr,yT);
  x.lineTo(rr,yB);
  if(p.ryB) x.ellipse(p.cx,yB,p.r,p.ryB,0,0,Math.PI,false); else x.lineTo(l,yB);
  x.closePath(); x.fillStyle=UNDER(p.col); x.fill();
  if(p.ryT && p.wT!=null) capOf(p,yT);   // the stripe starts below the cap: paint the cap first so the stripe's top edge shows
  x.beginPath(); x.moveTo(l,yT); if(p.ryT) x.ellipse(p.cx,yT,p.r,p.ryT,0,Math.PI,0,false); else x.lineTo(rr,yT); x.lineTo(rr,yB); if(p.ryB) x.ellipse(p.cx,yB,p.r,p.ryB,0,0,Math.PI,false); else x.lineTo(l,yB); x.closePath();
  x.save(); x.clip(); x.fillStyle=C.white; { const w0=p.wT!=null? p.wT+dy : yT-50; x.fillRect(p.white,w0,(p.we??rr+2)-p.white,yB+50-w0); } x.restore();
  if(p.ryT && p.wT==null) capOf(p,yT);
  satin(()=>{ x.beginPath(); x.moveTo(l,yT); if(p.ryT) x.ellipse(p.cx,yT,p.r,p.ryT,0,Math.PI,0,false); else x.lineTo(rr,yT);
    x.lineTo(rr,yB); if(p.ryB) x.ellipse(p.cx,yB,p.r,p.ryB,0,0,Math.PI,false); else x.lineTo(l,yB); x.closePath(); }, dy);
}
// the coin's satin grain on the press: fine + soft blotches of light and dark, one screen pixel per grain, riding with the part
const GRN=(()=>{ const N=256, c=document.createElement('canvas'); c.width=c.height=N; const g=c.getContext('2d'), id=g.createImageData(N,N), d=id.data;
  const f=new Float32Array(N*N).map(()=>Math.random()-0.5), b=new Float32Array(N*N);
  for(let y=0;y<N;y++) for(let xx=0;xx<N;xx++){ let v=0; for(let k=-1;k<=1;k++) for(let m=-1;m<=1;m++) v+=f[((y+k+N)%N)*N+((xx+m+N)%N)]; b[y*N+xx]=v/9; }
  for(let i=0;i<N*N;i++){ const v=128+(f[i]*0.35+b[i]*1.2)*95; d[i*4]=d[i*4+1]=d[i*4+2]=Math.max(0,Math.min(255,v)); d[i*4+3]=255; }
  g.putImageData(id,0,0); return x.createPattern(c,'repeat'); })();
const GK=+(Q.get("pgrit")??0.22);
function satin(path, dy){ if(GK<=0) return;
  x.save(); path(); x.clip(); x.globalCompositeOperation='soft-light'; x.globalAlpha=GK;
  GRN.setTransform(new DOMMatrix().translate(0,dy).scale(1/s)); x.fillStyle=GRN; x.fillRect(BOX.x-20,BOX.y-60,BOX.w+40,BOX.h+120); x.restore(); }
// one cycle (s): rest up, down, strike, up; the coin shows as the ram clears it, then leaves (wall)
// the coin is made at the blow (hidden inside the closed punches) and shows as the ram lifts off it
const T={down:[0.9,1.15], hold:[1.15,1.32], up:[1.32,2.3], appear:1.15, end:+(Q.get('cycle')||6)};
const sm=t=>t*t*(3-2*t), clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), seg=(t,a,b)=>clamp((t-a)/(b-a));
function ramY(t){
  if(t<T.down[0]) return OPEN;
  if(t<T.down[1]){ const u=seg(t,...T.down); return OPEN+(HIT-OPEN)*u*u*u; }             // accelerates into the blow
  if(t<T.hold[1]){ const u=t-T.hold[0]; return HIT-Math.abs(Math.sin(u*60))*2.2*Math.exp(-u*22); }   // a small rebound
  if(t<T.up[1]) return HIT+(OPEN-HIT)*sm(seg(t,...T.up));
  return OPEN; }
function impact(t){   // short white strokes out of the die at the blow
  const u=(t-T.down[1])/0.22; if(u<0||u>1) return;
  x.save(); x.strokeStyle=C.white; x.lineCap='round'; x.lineWidth=4; x.globalAlpha=1-u;
  const cy=452, cx0=208+OX, d=60+u*40, len=26*(1-u*0.5);
  for(const sx of [-1,1]) for(const a of [-0.45,0,0.45]){ const ca=Math.cos(a), sa=Math.sin(a), x0=cx0+sx*(d)*ca, y0=cy+d*sa*0.6;
    x.beginPath(); x.moveTo(x0,y0); x.lineTo(x0+sx*len*ca, y0+len*sa*0.6); x.stroke(); }
  x.restore(); }
// 2026-11-25 Figma 9680:636: the XX mark on the ram (moves with it) and the line on the base (ref px)
const XX=new Image(); XX.src='icons/xx-logo.svg'; try{ document.fonts.load('700 13px "Wix Madefor Display"'); }catch(e){}
const ART=document.createElement('canvas'), ax=ART.getContext('2d');
function emboss(paint, colour){   // paint() draws the art (in ref px) into ax; then: shadow down-right, highlight up-left, the art itself
  ART.width=cv.width; ART.height=cv.height; ax.setTransform(s,0,0,s,-B.x,-B.y); paint(ax);
  const tint=(c)=>{ const t=document.createElement('canvas'); t.width=ART.width; t.height=ART.height; const tx=t.getContext('2d');
    tx.drawImage(ART,0,0); tx.globalCompositeOperation='source-in'; tx.fillStyle=c; tx.fillRect(0,0,t.width,t.height); return t; };
  const o=Math.max(1,0.9*s), sh=tint('rgba(0,40,20,0.55)'), hi=tint('rgba(255,255,255,0.5)');
  x.save(); x.setTransform(1,0,0,1,0,0);
  x.drawImage(sh, o, o); x.drawImage(hi, -o*0.8, -o*0.8);
  if(colour) x.drawImage(tint(colour),0,0); else x.drawImage(ART,0,0);
  x.restore(); }
// the art is embossed once into its own layer (the XX rides with the ram: drawn offset by dy)
let xxCv=null, txCv=null;
function layer(fn){ const keep=x, c=document.createElement('canvas'); c.width=cv.width; c.height=cv.height; x=c.getContext('2d'); fn(); x=keep; return c; }
function pressArt(dy, which){
  if(!xxCv && XX.complete && XX.naturalWidth) xxCv=layer(()=>emboss(g=>g.drawImage(XX, 1711.1, 207.0, 107.6, 59.4)));
  if(!txCv && document.fonts.check('700 13px "Wix Madefor Display"')) txCv=layer(()=>emboss(g=>{ g.font='700 13.31px "Wix Madefor Display", system-ui, sans-serif';
    g.textAlign='center'; g.textBaseline='alphabetic'; g.fillStyle='#000';
    g.fillText('Twenty Years.', 1774.9, 620.4); g.fillText('One Hell of a Ride.', 1774.9, 637.4); }, '#006231'));
  x.save(); x.setTransform(1,0,0,1,0,0); if(which==='xx' && xxCv) x.drawImage(xxCv,0,dy*s); if(which==='text' && txCv) x.drawImage(txCv,0,0); x.restore();
}
// the frame's grunge texture (office.html lays it over the screen but leaves this box out): here the ram's share rides
// with the ram, so the texture never slides over the moving press. Same tiles, same origin as office.html.
const GRU=new Image(); GRU.src='icons/grunge.jpg'; const GOP=+(Q.get('grainop')??0.6);
const RAM=document.createElement('canvas'), RMK=document.createElement('canvas'); RAM.width=RMK.width=cv.width; RAM.height=RMK.height=cv.height;
function grunge(g, dyPx){ if(!(GRU.complete && GRU.naturalWidth) || GOP<=0) return;
  const p=g.createPattern(GRU,'repeat'), tw=529.6*s, th=353.1*s;
  p.setTransform(new DOMMatrix().translate(-9*s - B.x, -B.y + dyPx).scale(tw/GRU.naturalWidth, th/GRU.naturalHeight));
  g.save(); g.setTransform(1,0,0,1,0,0); g.globalCompositeOperation='overlay'; g.globalAlpha=GOP; g.fillStyle=p; g.fillRect(0,0,g.canvas.width,g.canvas.height); g.restore(); }
// the still part and the ram are each drawn once into their own layer (redrawn only when an asset arrives or the
// background colour changes); each frame just lays the two down, the ram moved by dy. Cheap enough for a 4K screen.
const PAD=60*s, STILL=document.createElement('canvas'); STILL.width=cv.width; STILL.height=cv.height; RAM.height=cv.height+Math.round(PAD);
let cacheKey=null;
function build(){
  const ln=BOX_LINE, keep=x;
  // still: backdrop, panel, base, the base's line, the frame, and its texture
  x=STILL.getContext('2d'); x.setTransform(1,0,0,1,0,0);
  drawBackdrop(x, cv.width, cv.height, B.x, B.y, FH);   // opaque: the wall's coins never show through the box
  x.setTransform(s,0,0,s,-B.x,-B.y);
  x.save(); x.beginPath(); x.rect(BOX.x+ln,BOX.y+ln,BOX.w-2*ln,BOX.h-2*ln); x.clip();
  if(BG.top.toLowerCase()==='#e8b0e3'){ x.fillStyle='rgba(224,139,217,0.18)'; x.fillRect(BOX.x,BOX.y,BOX.w,BOX.h); }   // Figma 9680:636: the box's own pink panel, a touch deeper than the wall
  for(const p of LOW) part(p);
  pressArt(0,'text');
  x.restore();
  x.strokeStyle=C.white; x.lineWidth=ln; x.strokeRect(BOX.x+ln/2,BOX.y+ln/2,BOX.w-ln,BOX.h-ln);
  grunge(x, 0);
  // ram at rest (dy 0), PAD px of extra room above so it can move down; its texture is part of it, so it moves with it
  const rx=RAM.getContext('2d'); x=rx; rx.setTransform(1,0,0,1,0,0); rx.clearRect(0,0,RAM.width,RAM.height);
  x.setTransform(s,0,0,s,-B.x,-B.y+PAD);
  for(const p of UP) part(p,0);
  pressArt(PAD/s,'xx');
  const mk=RMK.getContext('2d'); RMK.height=RAM.height; mk.globalCompositeOperation='copy'; mk.drawImage(RAM,0,0);
  grunge(rx, PAD); rx.save(); rx.setTransform(1,0,0,1,0,0); rx.globalCompositeOperation='destination-in'; rx.drawImage(RMK,0,0); rx.restore();
  x=keep; }
function draw(t){
  const ln=BOX_LINE, dy=ramY(t);
  const key=[!!(GRU.complete&&GRU.naturalWidth), !!xxCv, !!txCv, BG.top, document.fonts.check('700 13px "Wix Madefor Display"')].join();
  if(key!==cacheKey){ cacheKey=key; build(); if(!xxCv||!txCv) pressArt(0,'none'); }
  x.setTransform(1,0,0,1,0,0); x.globalCompositeOperation='copy'; x.drawImage(STILL,0,0); x.globalCompositeOperation='source-over';
  x.save(); x.beginPath(); x.rect((BOX.x+ln)*s-B.x,(BOX.y+ln)*s-B.y,(BOX.w-2*ln)*s,(BOX.h-2*ln)*s); x.clip();
  x.drawImage(RAM, 0, dy*s-PAD); x.restore();
  // the blow's white strokes on top
  x.setTransform(s,0,0,s,-B.x,-B.y); impact(t);
}

// ---------- the queue: every milestone, with people in between (as before) ----------
const AIDEMO=Q.has('aifaces'), WATCH=AIDEMO? null : window.watchPeople;
const DEMO=(AIDEMO? [['Noa Peretz',2014,'r0'],['Ruth Klein',2008,'r2'],['David Mensah',2016,'r3'],['Maya Cohen',2023,'r4'],['Avi Shalom',2007,'r5']] : [['Noa Peretz',2014,'p0'],['Yossi Amar',2019,'p1'],['Ruth Klein',2008,'p2'],['David Mensah',2016,'p3'],['Maya Cohen',2023,'p4'],['Avi Shalom',2007,'p5']])
  .map(([name,year,f])=>({id:'ph-'+f, name, year, photo:'people/'+f+'.jpg'}));
let PEOPLE=[], FRESH=[], mi=0, pi=0, wantPerson=false, seen=null;
const personItem=p=>({kind:'person', id:p.id, name:p.name, year:p.year||2026, photo:p.photo});
// picked one at a time: a milestone, then an employee, and so on (the employee list arrives a few seconds after start,
// so a queue built up front had no one in it for the first 71 milestones); a new upload is struck next
function onPeopleList(l){ const list=l.filter(p=>p.photo), keys=list.map(p=>p.id+'|'+(p.added||''));
  if(seen){ const fresh=list.filter((p,i)=>!seen.has(keys[i])); FRESH.push(...fresh.map(personItem)); }
  seen=new Set(keys); PEOPLE=list; }
if(WATCH) WATCH(onPeopleList, 15000);
function nextItem(){ if(FRESH.length) return FRESH.shift();
  const ps=WATCH? PEOPLE : DEMO;
  if(wantPerson && ps.length){ wantPerson=false; return personItem(ps[pi++ % ps.length]); }
  wantPerson=true; const [year,title]=MILESTONES[mi++ % MILESTONES.length]; return {kind:'milestone', year, title}; }

let t=+(Q.get('t')||0), last=performance.now(), cur=nextItem(), fired=false, frozen=Q.has('t'), n=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000)*SPEED; last=now; if(!frozen) t+=dt;
  if(t>=T.appear && !fired){ fired=true; n++;
    const it={...cur, color:colorFor(cur.year)};
    if(parent!==window) parent.postMessage({type:'minted', item:it}, '*'); }
  if(t>=T.end){ t-=T.end; fired=false; cur=nextItem(); }
  draw(t); requestAnimationFrame(frame); }
window.__mint={ dy:()=>ramY(t), state:()=>t+0.001, seek:v=>{ t=v; frozen=true; fired=v>=T.appear; }, play:()=>{ frozen=false; }, T, count:()=>n };
requestAnimationFrame(frame);
</script>
</body>
</html>
