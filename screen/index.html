<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Coin Wall v2</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  html,body{margin:0;overflow:hidden;background:transparent}
  body:not(.embed){background:#f0b9eb}
  canvas{display:block}
  #c{opacity:0;transition:opacity 1.2s}
  body:not(.embed) canvas{width:100vw;height:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/people/people.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
// v2 wall: lit matte-metal coins in the coin colours (soft key light + room reflections, subtle depth of field),
// on a transparent canvas over the site backdrop.
// In the office the press box sits over the left: coins behind it are cut out (?hole), and the struck coin is drawn
// in front of it, from the lower punch out over the frame into the wall.
import * as THREE from 'three';
{ const sd=new URLSearchParams(location.search).get('seed'); if(sd){ let x=(+sd||1)>>>0; Math.random=()=>{ x^=x<<13; x>>>=0; x^=x>>>17; x^=x<<5; x>>>=0; return x/4294967296; }; } }
import { MILESTONES } from './milestones.js';
import { colorFor, layout, drawBackdrop, PRESS, setCoinColors } from './v2-style.js';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';

const YEARS = [
 [2006,'Wix is founded'],[2007,'First employees'],[2008,'First product'],[2009,'Million users'],[2010,'Going global'],[2011,'Moving to the Namal'],
 [2012,'Moved to HTML5'],[2013,'Going public'],[2014,'First verticals'],[2015,'First Super Bowl ad'],[2016,'Launching ADI'],[2017,'100M users'],
 [2018,'Business suite'],[2019,'Launching Wix Payments'],[2020,'Covid times'],[2021,'Growing fast'],[2022,'Opening Wix Campus'],[2023,'Wix Studio'],
 [2024,'New era of AI'],[2025,'Base44 joined Wix'],[2026,'Harmony & Symphony']
];
const PLACEHOLDER = [['Noa Peretz',2014,'p0'],['Yossi Amar',2019,'p1'],['Ruth Klein',2008,'p2'],
                ['David Mensah',2016,'p3'],['Maya Cohen',2023,'p4'],['Avi Shalom',2007,'p5']].map(([name,year,f])=>({id:'ph-'+f, name, year, photo:'people/'+f+'.jpg', placeholder:true}));
const QP=new URLSearchParams(location.search);
// ?aifaces: demo people with ready AI relief portraits (people/r*.jpg), instead of the live uploads feed
const AIDEMO=QP.has('aifaces'), WATCH=AIDEMO? null : window.watchPeople;
if(AIDEMO) PLACEHOLDER.splice(0,PLACEHOLDER.length, ...[['Noa Peretz',2014,'r0'],['Ruth Klein',2008,'r2'],['David Mensah',2016,'r3'],['Maya Cohen',2023,'r4'],['Avi Shalom',2007,'r5']].map(([name,year,f])=>({id:'ph-'+f, name, year, photo:'people/'+f+'.jpg', depth:['r0','r3','r4'].includes(f)? 'people/'+f+'-depth.jpg' : null, placeholder:true})));
// everyone who uploaded keeps coming back for the whole event: 24 faces in flight at once (fits the same atlas as 10), one swapped in every 20 s
const LIVE_MAX=Math.max(1,+(QP.get('slots')||24)), PSLOTS=LIVE_MAX+1;
const ROT_S=+(QP.get('rotate')||20);
const NY=MILESTONES.length;
const yIdx=y=>{ const i=YEARS.findIndex(r=>r[0]===y); return i>=0? i : (y && y<YEARS[0][0]? 0 : YEARS.length-1); };
const CARDS = [...MILESTONES.map(([year,title])=>({kind:'year', yi:yIdx(year), year, title})),
  ...Array.from({length:PSLOTS},(_,k)=>({kind:'person', slot:k, yi:YEARS.length-1, name:'', year:null, id:null, state:'free', since:0}))];
const FULL = QP.has('full');
const W = +QP.get('w') || (FULL? 4640 : 2320), H = +QP.get('h') || (FULL? 1760 : 880);
if(QP.has('embed')) document.body.classList.add('embed');
const FONT='"Wix Madefor Display"';
const LAY=layout(W,H), HOLE=QP.has('hole')? LAY.box : null;
// ---------- coin geometry: the site's numbers (r 0.5, thickness 0.13, bevel 0.025, dome 0.016, raised ring) ----------
const R=0.5, T=+(QP.get('thick')||0.095), BEV=0.02, DOME=0.016, RF=R-BEV, HT=T/2, SEG=128;
const RING_R=0.9*R, RING_T=0.035*R;
function domeDisc(){
  const rings=32, pos=[], uv=[], idx=[]; const hz=t=>HT+DOME*(1-t*t);
  pos.push(0,0,hz(0)); uv.push(0.5,0.5);
  for(let k=1;k<=rings;k++){ const t=k/rings; for(let s=0;s<SEG;s++){ const a=s/SEG*Math.PI*2, x=Math.cos(a)*RF*t, y=Math.sin(a)*RF*t; pos.push(x,y,hz(t)); uv.push(x/(2*RF)+0.5, y/(2*RF)+0.5); } }
  for(let s=0;s<SEG;s++) idx.push(0,1+s,1+(s+1)%SEG);
  for(let k=1;k<rings;k++){ const a0=1+(k-1)*SEG, b0=1+k*SEG; for(let s=0;s<SEG;s++){ const s1=(s+1)%SEG; idx.push(a0+s,b0+s,b0+s1, a0+s,b0+s1,a0+s1); } }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
function rimLathe(){
  const pts=[], BS=10;
  for(let i=0;i<=BS;i++){ const a=Math.PI/2*i/BS; pts.push(new THREE.Vector2(RF+BEV*Math.sin(a), -HT+BEV-BEV*Math.cos(a))); }
  // the straight edge gets extra rows so the reeding band (uv v) is narrow and exact
  for(let i=1;i<8;i++){ const z=(-HT+BEV)+(2*(HT-BEV))*i/8; pts.push(new THREE.Vector2(R, z)); }
  for(let i=0;i<=BS;i++){ const a=Math.PI/2*i/BS; pts.push(new THREE.Vector2(R-BEV+BEV*Math.cos(a), HT-BEV+BEV*Math.sin(a))); }
  const g=new THREE.LatheGeometry(pts,SEG); g.rotateX(Math.PI/2); return g;
}
function concat(parts){ // [[geometry, group]] -> one non-indexed geometry with material groups
  const P=[],N=[],UV=[]; const out=new THREE.BufferGeometry(); let start=0;
  for(const [g0,grp] of parts){ const g=g0.index? g0.toNonIndexed() : g0;
    if(!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    P.push(...g.attributes.position.array); N.push(...g.attributes.normal.array); UV.push(...g.attributes.uv.array);
    const n=g.attributes.position.count; out.addGroup(start,n,grp); start+=n; }
  out.setAttribute('position',new THREE.Float32BufferAttribute(P,3)); out.setAttribute('normal',new THREE.Float32BufferAttribute(N,3)); out.setAttribute('uv',new THREE.Float32BufferAttribute(UV,2));
  out.computeBoundingSphere(); return out;
}
const ringZ=HT+DOME*(1-(RING_R/RF)**2);
const ringGeo=()=>new THREE.TorusGeometry(RING_R,RING_T,24,SEG);
const COIN_GEO=concat([
  [rimLathe(),0],
  [ringGeo().translate(0,0,ringZ),3], [ringGeo().translate(0,0,-ringZ),3],
  [domeDisc(),1], [domeDisc().rotateY(Math.PI),2],
]);

// ---------- face atlas: per card a front and a back cell. Height -> normal map; frost -> roughness; photo -> albedo ----------
const CS=+(QP.get('cs')||512), AC=Math.max(8, 2*Math.ceil(Math.sqrt(CARDS.length*2)/2)), AR=Math.ceil(CARDS.length*2/AC);   // near-square: GPUs cap each side at 16384 (8 wide went 21504 tall with 71 milestones)
const K=CS/512;                                    // the face art below is drawn in a 512 frame (ring at r≈242)
function arcText(x, text, r, mid, bottom, size, weight=800, track=0.06){
  x.font=`${weight} ${size}px ${FONT}`; const ch=[...text]; const ws=ch.map(c=>x.measureText(c).width+size*track);
  const tot=ws.reduce((a,b)=>a+b,0); let a=mid-(bottom?-1:1)*tot/r/2;
  ch.forEach((c,i)=>{ const da=ws[i]/r*(bottom?-1:1); const am=a+da/2;
    x.save(); x.rotate(am); x.translate(0, bottom? r : -r);
    x.textAlign='center'; x.textBaseline= bottom?'top':'alphabetic'; x.fillText(c,0,0); x.restore(); a+=da; });
}
function star(x, cx, cy, r){ x.beginPath(); for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, rr=k%2?r*0.45:r; x.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr);} x.fill(); }
function fitFont(x, text, weight, maxPx, maxW){ let s=maxPx; do{ x.font=`${weight} ${s}px ${FONT}`; s-=2; }while(x.measureText(text).width>maxW && s>10); return s+2; }
const up=s=>s.toUpperCase();
// The art follows the 2026-11-24 coin sheet. 512 frame: the face edge is r 256; the raised rim sits just inside it.
const ARC_TRACK=0.02;
const arcLen=(x,text,s,w,track)=>{ x.font=`${w} ${s}px ${FONT}`; return [...text].reduce((a,c)=>a+x.measureText(c).width+s*track,0); };
function starsSide(x){ for(const sx of [-1,1]) for(let k=-2;k<=2;k++){ const a=Math.PI/2*(1-sx)+k*0.205*sx, r=208; star(x, sx*Math.abs(Math.cos(k*0.205))*r, Math.sin(k*0.205)*r*1.0-10, 11.5); } }
function personArt(x, c){   // name round the top, WIX at both sides, the start year at the bottom; the portrait is drawn by the shader
  const name=up(c.name||''); let sz=58; while(sz>26 && arcLen(x,name,sz,600,ARC_TRACK)/182>2.35) sz-=2;
  arcText(x, name, 182, 0, false, sz, 600, ARC_TRACK);
  x.textAlign='center'; x.textBaseline='middle'; x.font=`700 24px ${FONT}`;
  if(QP.has('celebrate')){   // ?celebrate (the per-employee GIF): the year at both sides, "CELEBRATING 20 YEARS OF WIX" round the bottom
    if(c.year){ x.font=`700 26px ${FONT}`; x.fillText(String(c.year),-196,12); x.fillText(String(c.year),196,12); }
    arcText(x, 'CELEBRATING 20 YEARS OF WIX', 190, 0, true, 26, 600, 0.04); return; }
  x.fillText('WIX',-203,12); x.fillText('WIX',203,12);
  if(c.year){ x.font=`600 56px ${FONT}`; x.fillText(String(c.year),0,196); }   // clear of the raised rim (ring inner edge ≈ r 233)
}
function wrapLines(x, text, w, size){ x.font=`600 ${size}px ${FONT}`; const out=[]; let line='';
  for(const word of text.split(' ')){ const t=line? line+' '+word : word; if(x.measureText(t).width>w && line){ out.push(line); line=word; } else line=t; }
  if(line) out.push(line); return out; }
function milestoneArt(x, c){   // WIX on top, the year big, the event under it, stars both sides, "20 YEARS OF WIX" round the bottom
  const year=String(YEARS[c.yi][0]), title=up(c.title||YEARS[c.yi][1]);
  x.textAlign='center'; x.textBaseline='middle';
  x.font=`700 38px ${FONT}`; x.fillText('WIX',0,-208);
  const ys=fitFont(x,year,500,136,300); x.font=`500 ${ys}px ${FONT}`; x.fillText(year,0,-34);
  let ts=32, L=wrapLines(x,title,250,ts); while(L.length>3 && ts>20){ ts-=2; L=wrapLines(x,title,270,ts); }
  x.font=`600 ${ts}px ${FONT}`; L.forEach((l,i)=>x.fillText(l,0,58+i*ts*1.15));
  starsSide(x);
  arcText(x, '20 YEARS OF WIX', 186, 0, true, 24, 600, 0.04);
}
function backArt(x){   // the other side of every coin: GO TO / 20 / YEARS OF WIX / WIXTIMELINE.COM
  x.textAlign='center'; x.textBaseline='middle';
  arcText(x, 'GO TO', 206, 0, false, 24, 600, 0.06);
  x.font=`500 262px ${FONT}`; x.fillText('20',0,-14);
  x.font=`600 32px ${FONT}`; x.fillText('YEARS OF WIX',0,104);
  starsSide(x);
  arcText(x, 'WIXTIMELINE.COM', 183, 0, true, 33, 600, 0.03);
}
const normCv=document.createElement('canvas'), roughCv=document.createElement('canvas'), albCv=document.createElement('canvas');
for(const c of [normCv,roughCv,albCv]){ c.width=CS*AC; c.height=CS*AR; }
const ROUGH_FIELD=0.22, ROUGH_FROST=0.55, NSTR=10;
function blurWrap(a, S, r){ const t=new Float32Array(S*S);
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){ let v=0; for(let k=-r;k<=r;k++) v+=a[y*S+((x+k+S)%S)]; t[y*S+x]=v; }
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){ let v=0; for(let k=-r;k<=r;k++) v+=t[((y+k+S)%S)*S+x]; a[y*S+x]=v; } return a; }
function unitVar(a){ let m=0,v=0; for(const x of a) m+=x; m/=a.length; for(const x of a) v+=(x-m)**2; v=Math.sqrt(v/a.length)||1; for(let i=0;i<a.length;i++) a[i]=(a[i]-m)/v; return a; }
// ?grain=fineBlur,fineMix,coarseMix — fine grain wider than a screen pixel shimmers less
const GRN=(new URLSearchParams(location.search).get('grain')||'2,0.9,0.25').split(',').map(Number); GRN[0]=Math.max(1,Math.round(GRN[0]));
function makeGrain(S){
  const f=unitVar(blurWrap(Float32Array.from({length:S*S},()=>Math.random()-0.5), S, GRN[0]));
  const c=unitVar(blurWrap(Float32Array.from({length:S*S},()=>Math.random()-0.5), S, 4*Math.max(1,GRN[0]/1.5)|0));
  return f.map((v,i)=>v*GRN[1]+c[i]*GRN[2]);
}
const GRAIN=makeGrain(CS);
const GK=+(QP.get('grit')??0.25), G_FIELD=0.009*GK, G_RELIEF=0.018*GK, G_ROUGH=0.05*GK;   // satin: a quarter of the old grain   // bump height (relief = 1) and roughness jitter
function scratches(x, ox, oy){  // hairline wear: random scuffs + faint circular polishing marks, written into roughness (G)
  x.save(); x.globalCompositeOperation='lighter'; x.beginPath(); x.rect(ox,oy,CS,CS); x.clip(); x.translate(ox+CS/2, oy+CS/2); x.lineCap='round';
  for(let k=0;k<260;k++){ const a=Math.random()*6.28, r=Math.random()*CS*0.47, l=10+Math.random()*90, b=Math.random()*6.28;
    x.strokeStyle=`rgba(0,${(0.03+Math.random()*0.05)*255|0},0,1)`; x.lineWidth=0.6+Math.random()*1.1;
    x.beginPath(); x.moveTo(Math.cos(a)*r, Math.sin(a)*r); x.lineTo(Math.cos(a)*r+Math.cos(b)*l, Math.sin(a)*r+Math.sin(b)*l); x.stroke(); }
  for(let k=0;k<70;k++){ const r=Math.random()*CS*0.47, a=Math.random()*6.28;
    x.strokeStyle=`rgba(0,${(0.03+Math.random()*0.05)*255|0},0,1)`; x.lineWidth=0.8; x.beginPath(); x.arc(0,0,r,a,a+0.3+Math.random()*1.2); x.stroke(); }
  // soft smudges: a few broad patches a touch hazier
  for(let k=0;k<5;k++){ const g=x.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,'rgb(0,18,0)'); g.addColorStop(1,'rgb(0,0,0)');
    x.save(); x.translate((Math.random()-0.5)*CS*0.7,(Math.random()-0.5)*CS*0.7); x.scale(60+Math.random()*120, 40+Math.random()*90); x.fillStyle=g; x.beginPath(); x.arc(0,0,1,0,7); x.fill(); x.restore(); }
  x.restore();
}
let nx, rx, ax, hx, px;
async function buildFaces(imgs){
  nx=normCv.getContext('2d'); rx=roughCv.getContext('2d'); ax=albCv.getContext('2d');
  nx.fillStyle='rgb(128,128,255)'; nx.fillRect(0,0,normCv.width,normCv.height);
  rx.fillStyle=`rgb(0,${ROUGH_FIELD*255|0},0)`; rx.fillRect(0,0,roughCv.width,roughCv.height);
  ax.fillStyle='#fff'; ax.fillRect(0,0,albCv.width,albCv.height);
  const hc=document.createElement('canvas'); hc.width=hc.height=CS; hx=hc.getContext('2d',{willReadFrequently:true});
  const pc=document.createElement('canvas'); pc.width=pc.height=CS; px=pc.getContext('2d',{willReadFrequently:true});
  const all=[]; for(let i=0;i<CARDS.length;i++){ all.push(drawCard(i, imgs[i], [0,1])); do await new Promise(r=>setTimeout(r,0)); while(faceJobs.size>=FW_N*2); }   // keep a few faces in flight, not all (memory)
  await Promise.all(all);
}
// The per-pixel maths of a face (bump normals, roughness, crevice toning) runs in a few background workers, in parallel:
// drawing the whole wall on the page itself froze it (and the mint beside it in the office) for ~20 s at start.
const FACE_WORKER=`let G=null;
onmessage=e=>{ const m=e.data; if(m.grain){ G=m.grain; return; }
  const {id,CS,hd,photo,sh,K}=m, NN=CS*CS, h=new Float32Array(NN);
  for(let p=0;p<NN;p++) h[p]=hd[p*4]/255;
  const h0=h.slice();
  // portrait: shade = photo / its background grey (background = no change), faded out at the edge of its circle; a little of it is bump too
  const PS=photo? new Float32Array(NN).fill(1) : null;
  if(photo){ const {cx,cy,r,bg,bump,depth,dk,shade}=m.pc; for(let y=0;y<CS;y++) for(let x=0;x<CS;x++){ const p=y*CS+x, dd=Math.hypot(x-cx,y-cy); if(dd>=r) continue;
      const fade=1-Math.min(1,Math.max(0,(dd-r*0.82)/(r*0.18))), sf=fade*fade*(3-2*fade), f=Math.min(1.9,Math.max(0.3,(photo[p*4]/255)/bg)), k=(f-1)*sf;
      if(depth){ PS[p]=1+k*shade; h[p]+=(depth[p]/255)*dk*sf; }   // real height from the AI height map; the sculpture's own light only softly
      else { PS[p]=1+k; h[p]+=k*bump; } } }
  for(let p=0, g=sh%NN; p<NN; p++, g++){ if(g>=NN) g-=NN; const f=Math.min(1,h0[p]*1.6); h[p]+=G[g]*(K.G_FIELD+(K.G_RELIEF-K.G_FIELD)*f); }
  const N=new Uint8ClampedArray(NN*4), R=new Uint8ClampedArray(NN*4), A=new Uint8ClampedArray(NN*4), sh7=(sh*7)%NN;
  for(let y=0;y<CS;y++){ const y0=Math.max(0,y-1), y1=Math.min(CS-1,y+1);
    for(let x=0;x<CS;x++){ const x0=Math.max(0,x-1), x1=Math.min(CS-1,x+1), p=y*CS+x, q=p*4;
      const dx=(h[y*CS+x1]-h[y*CS+x0])*0.5, dy=(h[y0*CS+x]-h[y1*CS+x])*0.5;
      const ex=-dx*K.NSTR, ey=-dy*K.NSTR, l=Math.sqrt(ex*ex+ey*ey+1);
      N[q]=(ex/l*0.5+0.5)*255; N[q+1]=(ey/l*0.5+0.5)*255; N[q+2]=(1/l*0.5+0.5)*255; N[q+3]=255;
      const f=Math.min(1,h0[p]*1.6); let g=p+sh7; if(g>=NN) g-=NN;
      R[q+1]=(K.ROUGH_FIELD+(K.ROUGH_FROST-K.ROUGH_FIELD)*f + G[g]*K.G_ROUGH)*255; R[q+2]=Math.min(1,h0[p]*2.2)*255; R[q+3]=255;
      const tx=h0[y*CS+x1]-h0[y*CS+x0], ty=h0[y0*CS+x]-h0[y1*CS+x], T=Math.sqrt(tx*tx+ty*ty)*0.5*K.NSTR, sl=T/Math.sqrt(T*T+1);
      let v=0.5*(1-Math.min(0.55,sl*0.9))*(PS? PS[p] : 1)*255;   // 0.5 = the plain colour (the shader doubles it)
      A[q]=A[q+1]=A[q+2]=v; A[q+3]=255; } }
  postMessage({id,N,R,A},[N.buffer,R.buffer,A.buffer]); };`;
const FW_N=Math.max(1,Math.min(4,(navigator.hardwareConcurrency||4)-1));
const faceWorkers=Array.from({length:FW_N},()=>{ const w=new Worker(URL.createObjectURL(new Blob([FACE_WORKER],{type:'text/javascript'}))); w.postMessage({grain:GRAIN}); w.busy=0; return w; });
const faceJobs=new Map(); let faceJobId=0;
faceWorkers.forEach(w=>w.onmessage=e=>{ const j=faceJobs.get(e.data.id); faceJobs.delete(e.data.id); w.busy--; j(e.data); });
const FACE_K={G_FIELD, G_RELIEF, G_ROUGH, ROUGH_FIELD, ROUGH_FROST, NSTR};
function faceJob(hd, photo, sh, pc){ const w=faceWorkers.reduce((a,b)=>b.busy<a.busy?b:a); w.busy++; const id=++faceJobId;
  return new Promise(res=>{ faceJobs.set(id,res); const tr=[hd.buffer]; if(photo) tr.push(photo.buffer); if(pc?.depth) tr.push(pc.depth.buffer);
    w.postMessage({id, CS, hd, photo, sh, pc, K:FACE_K}, tr); }); }
// draws the art on the page (canvas text, blur), hands the pixel maths to a worker; resolves once the cell is in the atlas
let artX=null;
function drawCard(i, img, sides){ const c=CARDS[i]; const jobs=[];
  if(!artX){ const a=document.createElement('canvas'); a.width=a.height=CS; artX=a.getContext('2d'); }
  for(const side of sides){
    const cell=i*2+side, ox=(cell%AC)*CS, oy=Math.floor(cell/AC)*CS;
    // height: relief art in white on black, softened so the shoulders read as a struck bevel
    // drawn sharp, then blurred once (a blur filter left on while drawing re-blurs the whole face for every letter: ~0.4 s a face)
    artX.setTransform(1,0,0,1,0,0); artX.filter='none'; artX.fillStyle='#000'; artX.fillRect(0,0,CS,CS);
    artX.translate(CS/2,CS/2); artX.scale(K,K); artX.fillStyle='#fff'; artX.strokeStyle='#fff';
    side? backArt(artX) : c.kind==='person'? personArt(artX,c) : milestoneArt(artX,c);
    artX.setTransform(1,0,0,1,0,0);
    hx.setTransform(1,0,0,1,0,0); hx.filter='none'; hx.fillStyle='#000'; hx.fillRect(0,0,CS,CS);
    hx.filter=`blur(${1.1*K}px)`; hx.drawImage(artX.canvas,0,0); hx.filter='none';
    let photo=null, pc=null;
    if(!side && c.kind==='person' && img){
      // portrait: the AI bas-relief (or the plain photo), in a soft circle between the name and the year

const sig=(u,p)=>{ u=Math.min(1,Math.max(0,u)); const a=u**p; return a/(a+(1-u)**p); };          // strong ease in AND out (p 3 = long, soft ends)
const settle=u=>{ u=Math.min(1,Math.max(0,u)); const s=u*u*(3-2*u); return 1-(1-s)**4; };          // soft start, long slow stop
function coinH(){ return T/0.5*LAY.die.coinR; }                                    // coin thickness on screen at the punch
function strikePlan(){ const s=LAY.s, bx=LAY.box.x, D=D0(), k=+(QP.get('present')||2.35), Dp=D/k, Rp=0.5/halfH(Dp)*H/2;   // always the same size
  const upMin=(PRESS.UP[1].yB+PRESS.OPEN+14)*s;                                       // keep clear of the raised ram
  const p0=[LAY.die.x, LAY.die.y-coinH()/2], p1=[bx-Rp*(+(QP.get('over')||0.3)), Math.max(upMin+Rp, LAY.die.y-45*s)];   // one fixed spot, a good part of it over the box
  const p2=[P(W*0.48,W*0.7), P(H*0.28,H*0.72)];   // joins the wall near the middle, not far off (it read as running away)
  const tr=0.95, tb=tr+1.6, tc=tb+P(0.2,0.4), td=tc+P(1.1,1.3), te=td+P(0.5,0.7), tf=te+P(2.0,2.4);
  return { p0, p1, p2, D, Dp, d2:DMIN+P(1,4.5), tr, tb, tc, td, te, tf, turn:sgn()*Math.PI, lift:20*s,
    a2:P(30,150), b2:sgn()*P(0.8,2.2), r2:P(-1,1), ph:Math.random()*6.28, k2:0.35 }; }
// pose at time t -> [px, py, d, a (face tilt toward us, deg; 0 = lying flat), b (turn about screen-up), roll]
function planAt(L, t){
  if(t<L.tr) return [...L.p0, L.D, 9, 0, 0];
  if(t<L.tb){ const u=settle((t-L.tr)/(L.tb-L.tr)), ux=settle(Math.min(1,(t-L.tr)/(L.tb-L.tr)*1.15));   // a touch ahead in x: out first, not up into the ram
    const x=L.p0[0]+(L.p1[0]-L.p0[0])*ux, y=L.p0[1]+(L.p1[1]-L.p0[1])*u-Math.sin(u*Math.PI)*L.lift;
    return [x, y, L.D+(L.Dp-L.D)*u, 9+81*u, 0, 0]; }
  const sway=Math.sin(t*1.3+L.ph)*Math.min(1,(t-L.tb)/0.6);                            // breathing while it stands
  if(t<L.te){ const b=L.turn*sig((t-L.tc)/(L.td-L.tc),3);
    return [L.p1[0], L.p1[1]+sway*2*LAY.s, L.Dp, 90+sway*3, b, sway*0.02]; }
  const u=sig((t-L.te)/(L.tf-L.te),3), s0=Math.sin(L.te*1.3+L.ph);
  return [L.p1[0]+(L.p2[0]-L.p1[0])*u, L.p1[1]+s0*2*LAY.s+(L.p2[1]-L.p1[1])*u, L.Dp+(L.d2-L.Dp)*u,
    90+s0*3+(L.a2-90-s0*3)*u, L.turn+L.b2*u, s0*0.02+L.r2*u]; }
function strikePose(c, L, t){ const [px,py,d,a,b,roll]=planAt(L,t), p=fromPx(px,py,d);
  c.x=p.x; c.y=p.y; c.d=p.z;
  const pos=V(p.x,p.y,-p.z), f=pos.clone().negate().normalize(), r=V(0,1,0).cross(f).normalize(), u=f.clone().cross(r);
  const ar=THREE.MathUtils.degToRad(a), n=u.clone().multiplyScalar(Math.cos(ar)).addScaledVector(f,Math.sin(ar)).normalize().applyAxisAngle(u,b);
  const xr=r.clone().applyAxisAngle(u,b).applyAxisAngle(n,roll), yr=n.clone().cross(xr);
  c.mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xr,yr,n)); }
function strike(card){
  const c=makeCoin(card,{vx:0,vy:0}); c.K=strikePlan(); c.script={t:0}; c.front=true; strikePose(c,c.K,0); coins.push(c);
  if(coins.length>140){ const k=coins.findIndex(q=>!q.script && !q.front && q.d>12); if(k>=0){ scene.remove(coins[k].mesh); coins.splice(k,1); } }
  return c; }
function stepScript(c, dt){ const s=c.script; s.t+=dt; const L=c.K, T=L.tf;
  if(s.t<T){ strikePose(c, L, s.t); return; }
  // let go with the speed and spin it arrives with: it drifts on with the wall
  const e=0.02, ka=planAt(L,T-e), kb=planAt(L,T), a=fromPx(ka[0],ka[1],ka[2]), b=fromPx(kb[0],kb[1],kb[2]);
  const q0=new THREE.Quaternion(); strikePose({mesh:{quaternion:q0}}, L, T-e); strikePose(c, L, T); const q1=c.mesh.quaternion.clone();
  const dq=q1.clone().multiply(q0.clone().invert()); if(dq.w<0) dq.set(-dq.x,-dq.y,-dq.z,-dq.w);
  const ang=2*Math.acos(Math.min(1,dq.w)), sn=Math.sqrt(Math.max(1e-9,1-dq.w*dq.w));
  c.w.set(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(rnd(0.4,0.9)); c.ramp=0;   // it arrives at rest: the tumble and drift come in gently
  c.vx=(b.x-a.x)/e; c.vy=(b.y-a.y)/e; c.vd=(b.z-a.z)/e; c.vx0=DIR*Math.max(0.15,Math.min(0.35,Math.abs(c.vx))); c.recede=0; c.prec=0; c.script=null; c.K=null; }

// the ram's silhouette, cut out of the front layer each frame (read straight from the mint, so it moves in step)
const maskScene=new THREE.Scene(), maskCam=new THREE.OrthographicCamera(0,W,0,H,-1,1);
const maskMat=new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0, blending:THREE.NoBlending, side:THREE.DoubleSide, depthTest:false, depthWrite:false});
let maskMesh=null;
const mintWin=()=>{ try{ return parent.document.getElementById('mint')?.contentWindow?.__mint; }catch(e){ return null; } };
function drawMask(){ const m=mintWin(); if(!m) return; const dy=m.dy(), s=LAY.s;
  const shapes=PRESS.UP.map(p=>{ const sh=new THREE.Shape(), l=(p.cx-p.r)*s, rr=(p.cx+p.r)*s, yT=(p.yT+dy)*s, yB=(p.yB+dy)*s;
    sh.moveTo(l,yT); sh.lineTo(rr,yT); sh.lineTo(rr,yB); if(p.ryB) sh.absellipse(p.cx*s,yB,p.r*s,p.ryB*s,0,Math.PI,false); else sh.lineTo(l,yB); sh.lineTo(l,yT); return sh; });
  if(maskMesh){ maskMesh.geometry.dispose(); maskScene.remove(maskMesh); }
  maskMesh=new THREE.Mesh(new THREE.ShapeGeometry(shapes,24), maskMat); maskScene.add(maskMesh);
  const b=HOLE; renderer.setScissor(b.x, H-b.y-b.h, b.w, b.h); renderer.setScissorTest(true);
  renderer.render(maskScene, maskCam); renderer.setScissorTest(false); }

let last=performance.now(), simT=0, SPEED=+(QP.get('speed')??1);
// live tuning from the office panel (key S): how many coins fly, how fast they drift, how much depth blur. Kept in this browser.
const TUNE=(()=>{ let t={}; try{ t=JSON.parse(localStorage.getItem('wix20-tune')||'{}')||{}; }catch(e){}
  return { n: QP.has('n')? +QP.get('n') : (+t.n||110), speed: +t.speed||1, ap: QP.has('ap')? +QP.get('ap') : (t.ap ?? 0.3) }; })();
DOFU.aperture.value=TUNE.ap;
const wallCount=()=>coins.filter(c=>!c.script && !c.front && c.die==null).length;
function addWallCoin(){ const P=personCards('live'), Y=CARDS.map((c,i)=>i).filter(i=>CARDS[i].kind==='year');
  const c=makeCoin(P.length && Math.random()<0.4 ? fairPersonCard(-1) : Y[Math.floor(Math.random()*Y.length)]); respawn(c); coins.push(c); }   // comes in from the edge
addEventListener('message', e=>{ const m=e.data; if(m?.type!=='tune') return;
  if(m.speed!=null) TUNE.speed=+m.speed; if(m.ap!=null){ TUNE.ap=+m.ap; DOFU.aperture.value=TUNE.ap; } if(m.n!=null) TUNE.n=+m.n; });
function frame(now){
  const dt0=Math.min(0.05,(now-last)/1000); last=now; const dtA=dt0*SPEED; simT+=dtA*TUNE.speed; const t=simT;
  if(started && wallCount()<TUNE.n) addWallCoin();
  else if(started && wallCount()>TUNE.n){ let far=null; for(const c of coins) if(!c.script && !c.front && c.die==null && (!far || c.d>far.d)) far=c; if(far) far.die=0; }   // fewer: the farthest coins shrink away   // one a frame: fewer coins leave as they fly off (see respawn below), more come in from the edge
  for(const c of coins){
    if(c.script){ stepScript(c, dtA); if(c.script) continue; }
    const dt=dtA*TUNE.speed;
    if(c.die!=null){ c.die+=dt0*2; c.mesh.scale.setScalar(Math.max(0.001,1-c.die)); if(c.die>=1){ c.gone=true; scene.remove(c.mesh); continue; } }
    c.vy-=c.g*dt; c.x+=c.vx*dt; c.y+=(c.vy+Math.sin(t*0.35+c.ph)*0.04)*dt;
    if(c.thrown){ c.vx*=Math.pow(0.6,dt); if(c.g && c.vy<-0.3){ c.g=0; } }
    else { c.vx+=((c.vx0||0.5)-c.vx)*dt*0.3; c.vy*=Math.pow(0.75,dt); }
    tmpV.copy(c.w).applyAxisAngle(new THREE.Vector3(0,0,1), Math.sin(t*c.prec+c.ph)*0.6);
    if(c.ramp!==undefined && c.ramp<1) c.ramp=Math.min(1,c.ramp+dt/3); const ang=tmpV.length()*dt*(c.ramp??1); tmpQ.setFromAxisAngle(tmpV.normalize(), ang); c.mesh.quaternion.premultiply(tmpQ);
    if(c.recede){ c.vd+=c.recede*dt*3; c.recede*=Math.pow(0.3,dt); if(c.recede<0.05) c.recede=0; }
    c.d+=c.vd*dt; c.vd*=Math.pow(0.5,dt); if(c.d<DMIN){ c.d=DMIN; c.vd=Math.abs(c.vd); }
    if(c.front && HOLE && toPx(c.x,c.y,c.d)[0]+pxR(c.d)*1.1 < HOLE.x) c.front=false;   // clear of the box: an ordinary wall coin
    if(!HOLE) c.front=false;
    if(DIR*c.x-0.8>halfW(c.d) || c.y<-halfH(c.d)-1 || c.y>halfH(c.d)+1.5){ c.front=false; if(wallCount()>TUNE.n){ c.gone=true; scene.remove(c.mesh); } else respawn(c); }
  }
  if(coins.some(c=>c.gone)) coins.splice(0, coins.length, ...coins.filter(c=>!c.gone));
  collide(); screenSpread(dtA*TUNE.speed); for(const c of coins) c.mesh.position.set(c.x, c.y, -c.d);
  // 1: the wall, with the box cut out; 2: the coin in front of the box
  for(const c of coins) c.mesh.visible=!c.front;
  DOFU.focus.value=DMIN+(+(QP.get('focus')||4));
  renderer.setRenderTarget(rt); renderer.autoClear=true; renderer.render(scene,camera);
  quad.material=dofMat; renderer.setRenderTarget(rt2); renderer.render(dofScene,dofCam);
  quad.material=finMat; renderer.setRenderTarget(null); renderer.render(dofScene,dofCam);
  if(HOLE){ const b=HOLE; renderer.setScissor(b.x, H-b.y-b.h, b.w, b.h); renderer.setScissorTest(true); renderer.clear(); renderer.setScissorTest(false);
    const fr=coins.filter(c=>c.front); if(fr.length){ for(const c of coins) c.mesh.visible=!!c.front;
      renderer.setRenderTarget(rt); renderer.autoClear=true; renderer.render(scene,camera);
      quad.material=frontMat; renderer.setRenderTarget(null); renderer.autoClear=false; renderer.render(dofScene,dofCam);
      if(fr.some(c=>c.script && c.script.t<c.K.tr+0.05)) drawMask();   // the ram hides the coin only while it lies in the die; once it grows toward us it covers the upper punch
      renderer.autoClear=true; } }
  requestAnimationFrame(frame);
}
function throwCoin(card, sx, sy){ const d=DMIN+1; const x=(sx*2-1)*halfW(d), y=-(sy*2-1)*halfH(d);
  const c=makeCoin(card,{d, x, y, vx:DIR*rnd(0.6,0.9), vy:rnd(1.1,1.5), g:1.2, thrown:true}); c.w.multiplyScalar(1.8); coins.push(c);
  if(coins.length>140){ const k=coins.findIndex(q=>!q.thrown && !q.script); scene.remove(coins[k].mesh); coins.splice(k,1); } }
function cardFor(it){
  let card=-1;
  if(it.kind==='milestone') card=CARDS.findIndex(c=>c.kind==='year' && c.year===it.year && c.title===it.title);
  else card=CARDS.findIndex(c=>c.kind==='person' && c.state==='live' && (c.id===it.id || c.name===it.name));
  if(card<0 && it.kind==='person'){ const p=everyone.find(q=>q.id===it.id); if(p && !queue.some(q=>q.id===p.id)) queue.unshift({...p}); card=randomPersonCard(); }
  if(card<0) card=Math.floor(Math.random()*NY);
  return card; }
window.addEventListener('message', e=>{ const m=e.data; if(!m || m.type!=='minted' || !started) return; strike(cardFor(m.item||{})); });
window.__strike=it=>strike(cardFor(it||{})); window.__count=()=>wallCount(); window.__pos=()=>coins.filter(c=>!c.script&&!c.front).map(c=>[...toPx(c.x,c.y,c.d).map(Math.round), +c.d.toFixed(1)]);
if(parent!==window) addEventListener('keydown', e=>parent.postMessage({type:'key', key:e.key},'*'));   // a click on the wall takes the focus: pass keys (C, S) to the office
cv.addEventListener('click',e=>{ const r=cv.getBoundingClientRect(); throwCoin(randomPersonCard(),(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height); });
function fillWho(){}
// ---------- people: live list → person slots ----------
const loadImg=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src;});
// a person's picture + (when the sync made one) the AI height map of the same sculpture, used as the real relief
const depthUrl=p=>!p.depth? null : AIDEMO? p.depth : '/people/'+p.depth+'?v='+encodeURIComponent(p.added||'');
async function loadPerson(p){ const img=await loadImg(p.photo); const du=depthUrl(p); if(du && !QP.has('nodepth')) img.__depth=await loadImg(du).catch(()=>null); return img; }
const personCards=st=>CARDS.map((c,i)=>i).filter(i=>CARDS[i].kind==='person' && CARDS[i].state===st);
const NEW_MS=90000;
function fairPersonCard(cur){   // live person with the fewest coins in flight (this coin not counted); ties broken at random
  const P=personCards('live'); if(!P.length) return randomPersonCard();
  const n=new Map(P.map(k=>[k,0])); for(const o of coins) if(n.has(o.card)) n.set(o.card, n.get(o.card)+1);
  if(n.has(cur)) n.set(cur, n.get(cur)-1);
  for(const k of P) if(performance.now()-CARDS[k].since<NEW_MS) n.set(k, n.get(k)/3);   // a fresh upload jumps the queue: about triple share at first
  const min=Math.min(...n.values()), low=P.filter(k=>n.get(k)===min);
  return CARDS[cur]?.state==='live' && n.get(cur)===min ? cur : low[Math.floor(Math.random()*low.length)];
}
function randomPersonCard(){ const P=personCards('live'); return P.length? P[Math.floor(Math.random()*P.length)] : Math.floor(Math.random()*NY); }
let everyone=[], queue=[], rr=0, lastRotate=0, placing=false;
function setSlot(k, p){ Object.assign(CARDS[k], {id:p.id, key:p.id+'|'+(p.added||''), name:p.name, year:p.year, yi:yIdx(p.year), placeholder:!!p.placeholder, state:'live', since:performance.now()}); }
async function placeNext(){   // draw the next queued person into the free slot; retire one if over the limit
  if(placing || !queue.length) return; const k=personCards('free')[0]; if(k===undefined) return;
  placing=true; const p=queue.shift();
  try{
    const img=await loadPerson(p).catch(()=>null);
    if(img && everyone.some(q=>q.id===p.id) || p.placeholder){
      const old=CARDS.findIndex(c=>c.state==='live' && c.id===p.id);   // same person, new photo
      setSlot(k,p); const t0=performance.now(); await drawCard(k,img,[0]); uploadCell(k*2); window.__lastPlaceMs=performance.now()-t0;
      setCardMat(k);
      const live=personCards('live').filter(i=>i!==k);
      const out= old>=0? old : live.length>=LIVE_MAX ? live.sort((a,b)=>(CARDS[b].placeholder-CARDS[a].placeholder)||(CARDS[a].since-CARDS[b].since))[0] : -1;
      if(out>=0) CARDS[out].state='retiring';
      if(p.fresh) throwCoin(k, 0.1, 0.85);   // a newcomer arrives with a coin thrown in (also during a close-up)
      fillWho();
    }
  } finally { placing=false; }
}
function onPeople(list){
  everyone=list;   // empty = no faces yet (placeholders only when the people feed is missing)
  const ids=new Set(everyone.map(p=>p.id)), keys=new Set(everyone.map(p=>p.id+'|'+(p.added||'')));
  for(const c of CARDS) if(c.state==='live' && !keys.has(c.key)){ if(!ids.has(c.id)) c.state='retiring'; }   // removed → leaves with its coins
  queue=queue.filter(p=>ids.has(p.id));
  const fresh=everyone.filter(p=>!known.has(p.id+'|'+(p.added||''))).map(p=>({...p, fresh:started}));   // new uploads (or a new photo)
  for(const p of everyone) known.add(p.id+'|'+(p.added||''));
  queue=[...fresh, ...queue.filter(q=>!fresh.some(f=>f.id===q.id))];   // newest first, ahead of the rotation
  fillWho();
}
const known=new Set();
function peopleTick(){   // once a second
  for(const k of personCards('retiring')) if(!coins.some(c=>c.card===k) && !(hero && hero.mesh.material===MATS[k])) CARDS[k].state='free';
  const live=personCards('live');
  if(!queue.length && everyone.length>live.length && performance.now()-lastRotate>ROT_S*1000){   // more people than slots: rotate
    const shown=new Set(live.map(k=>CARDS[k].id)); const rest=everyone.filter(p=>!shown.has(p.id));
    if(rest.length){ queue.push(rest[rr++ % rest.length]); lastRotate=performance.now(); } }
  placeNext();
}
let started=false;
(async()=>{
  await Promise.all(['800 64px','600 18px'].map(f=>document.fonts.load(f+' '+FONT)));
  const first=await new Promise(res=>{ let done=false; const fin=l=>{ if(!done){ done=true; res(l); } };
    setTimeout(()=>fin([]),3000); WATCH ? WATCH(l=>{ if(!done) fin(l); else onPeople(l); }, +(QP.get('poll')||15)*1000) : fin([]); });
  everyone=WATCH? first : PLACEHOLDER;
  const imgs=[]; let k=0;
  for(const p of everyone){ if(k>=LIVE_MAX) break; const img=await loadPerson(p).catch(()=>null); if(!img) continue;
    const i=NY+k++; setSlot(i,p); imgs[i]=img; }
  for(const p of everyone) known.add(p.id+'|'+(p.added||''));
  lastRotate=performance.now();
  await buildFaces(imgs);
  normT=new THREE.CanvasTexture(normCv); roughT=new THREE.CanvasTexture(roughCv); albT=new THREE.CanvasTexture(albCv);
  for(const t of [normT,roughT,albT]){ t.colorSpace=THREE.NoColorSpace; t.anisotropy=renderer.capabilities.getMaxAnisotropy(); t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter; }
  makeMaterials();
  const Y=CARDS.map((c,i)=>i).filter(i=>CARDS[i].kind==='year'), P=personCards('live'); let yi=0;
  for(let i=0;i<TUNE.n;i++){ const c=makeCoin(P.length && i%5<2 ? fairPersonCard(-1) : Y[yi++%Y.length]); placeEven(c,false); coins.push(c); }
  started=true; setInterval(peopleTick,1000); window.__people={CARDS, queue:()=>queue, everyone:()=>everyone};
  separateAll(); for(const c of coins){ c.vx=DIR*Math.max(DIR*c.vx,0.3); c.vy*=0.3; c.vd=0; }
  if(QP.has('gif')){   // ?gif=<n>: one person coin alone, centred, on a clear background; window.__gifFrame(angle) draws one frame (for the per-employee GIF)
    for(const c of coins) scene.remove(c.mesh); coins.length=0;
    const k=personCards('live')[+(QP.get('gif')||0)] ?? NY, m=new THREE.Mesh(COIN_GEO, MATS[k]); scene.add(m);
    m.position.set(0,0,-0.5/(Math.tan(THREE.MathUtils.degToRad(15))*(+(QP.get('fill')||0.86))));
    window.__gifFrame=(a,tx)=>{ m.rotation.set(tx ?? +(QP.get('tilt')??0.18), a, 0); renderer.setRenderTarget(null); renderer.render(scene,camera); };
    window.__gifFrame(0); cv.style.opacity=1; window.__ready=true; return; }
  window.__ready=true; requestAnimationFrame(()=>requestAnimationFrame(()=>cv.style.opacity=1));
  if(QP.has('demo')) setInterval(()=>strike(Math.floor(Math.random()*NY)), 6000);   // standalone: strike on its own
  requestAnimationFrame(frame);
})();
