<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Figma "Make Your Mark — mobile upload page" (9660:2), drawn for a 390 x 844 phone. --u = one design px, so a narrower
     phone scales the whole page down instead of breaking the lines; wider screens keep the phone size. */
  :root{ --u:min(1px, calc(100vw / 390)); --btn:#fff; --btnText:#eca4e6; --ink:#000; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ min-height:100%; background:#eca4e6; }   /* Figma 9660:2 (11-25): one flat pink */
  body{ margin:0; min-height:100vh; min-height:100dvh; font-family:'Wix Madefor Display',system-ui,sans-serif; color:#fff; position:relative; overflow-x:hidden;
    /* the frame's grid: 2 px lines every 34 px (#EEB3E8), as in the design */
    background-image:linear-gradient(#eeb3e8 calc(2*var(--u)),transparent calc(2*var(--u))),linear-gradient(90deg,#eeb3e8 calc(2*var(--u)),transparent calc(2*var(--u)));
    background-size:calc(34*var(--u)) calc(34*var(--u)); background-position:calc(32.5*var(--u)) calc(11.5*var(--u)); }
  .page{ position:relative; width:calc(390*var(--u)); min-height:calc(844*var(--u)); margin:0 auto; }
  /* below the text everything sits where the design has it (top = design px from the top of the phone) */
  #flow>*{ position:absolute; }
  h1{ margin:0; position:relative; left:calc(17*var(--u)); top:0; padding-top:calc(46.5*var(--u)); width:calc(352*var(--u));
    font:700 calc(56*var(--u))/calc(49*var(--u)) 'Wix Madefor Display',system-ui,sans-serif; letter-spacing:-.03em; text-transform:uppercase; }
  .sub{ margin:calc(15*var(--u)) 0 0 calc(17*var(--u)); width:calc(343*var(--u)); font-weight:600; font-size:calc(17.13*var(--u)); line-height:calc(19.98*var(--u)); }
  .shot{ left:calc(55*var(--u)); top:calc(300.5*var(--u)); width:calc(280*var(--u)); height:calc(280*var(--u)); border-radius:50%; border:calc(3*var(--u)) solid #fff; overflow:hidden;
    display:flex; align-items:center; justify-content:center; text-align:center; font-weight:600; font-size:calc(15*var(--u)); line-height:calc(15*var(--u)); letter-spacing:-.03em; text-transform:uppercase; }
  .shot img{ width:100%; height:100%; object-fit:cover; }
  button{ border:0; cursor:pointer; color:#fff; font:600 calc(18*var(--u)) 'Wix Madefor Display',system-ui,sans-serif; text-transform:uppercase; }
  .pinkbtn{ left:50%; transform:translateX(-50%); top:calc(595*var(--u)); height:calc(39*var(--u)); width:calc(176*var(--u)); background:var(--btn); color:var(--btnText); }
  /* Amnon 2026-11-25: the circle sits where design screen 2 has it, before and after the selfie (it was lower before) */
  #again{ width:calc(154*var(--u)); }
  label.consent{ display:flex; gap:calc(13*var(--u)); align-items:flex-start; left:calc(27*var(--u)); top:calc(686.5*var(--u)); width:calc(262*var(--u));
    color:var(--ink); font-weight:500; font-size:calc(12*var(--u)); line-height:calc(16*var(--u)); cursor:pointer; }
  label.consent input{ appearance:none; -webkit-appearance:none; flex:none; width:calc(22*var(--u)); height:calc(22*var(--u)); margin:calc(-2.2*var(--u)) 0 0; border-radius:calc(3*var(--u)); background:#fff; display:grid; place-items:center; cursor:pointer; }
  label.consent input:checked::after{ content:''; width:calc(11*var(--u)); height:calc(6*var(--u)); border:solid var(--ink); border-width:0 0 calc(2.5*var(--u)) calc(2.5*var(--u)); transform:translateY(calc(-1.5*var(--u))) rotate(-45deg); }
  .send{ left:calc(27*var(--u)); top:calc(745*var(--u)); width:calc(337*var(--u)); height:calc(47*var(--u)); background:var(--ink); }
  /* messages float just above the strip, so they never push or cover the page's own parts */
  .msg{ position:fixed !important; left:calc(12*var(--u)); right:calc(12*var(--u)); bottom:calc(46*var(--u) + env(safe-area-inset-bottom, 0px)); z-index:4; max-width:calc(366*var(--u)); margin:0 auto;
    font-weight:600; font-size:calc(14*var(--u)); line-height:calc(18*var(--u)); color:#fff; background:var(--ink); padding:calc(9*var(--u)) calc(12*var(--u)); }
  .msg:empty{ display:none; }
  .msg.err{ background:#b3261e; }
  .msg a{ color:inherit; }
  .bar{ left:calc(27*var(--u)); right:calc(27*var(--u)); top:calc(737*var(--u)); height:calc(5*var(--u)); background:rgba(255,255,255,.45); overflow:hidden; display:none; }
  .bar i{ display:block; height:100%; width:30%; background:var(--ink); animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide{ 0%{ transform:translateX(-120%);} 100%{ transform:translateX(340%);} }
  .sent{ margin:calc(23*var(--u)) 0 0 calc(22*var(--u)); width:calc(296*var(--u)); font-weight:600; font-size:calc(15*var(--u)); line-height:calc(20*var(--u)); }
  .sent p{ margin:0 0 calc(20*var(--u)); }
  .hide{ display:none !important; }
  button:focus-visible,input:focus-visible{ outline:calc(3*var(--u)) solid #000; outline-offset:calc(2*var(--u)); }
  /* the frame's black strip, running */
  .strip{ position:fixed; left:0; right:0; bottom:0; height:calc(38*var(--u) + env(safe-area-inset-bottom, 0px)); padding-bottom:env(safe-area-inset-bottom, 0px); background:#000; overflow:hidden; z-index:2; }
  .strip .run{ position:absolute; left:0; top:0; height:calc(38*var(--u)); display:flex; align-items:center; white-space:nowrap; animation:run 26s linear infinite; }
  .strip span{ display:inline-flex; align-items:center; font-weight:600; font-size:calc(15*var(--u)); text-transform:uppercase; margin-right:calc(9*var(--u)); }
  .strip svg{ height:calc(16*var(--u)); width:auto; display:block; }
  @keyframes run{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }
  @media (prefers-reduced-motion: reduce){ .strip .run,.bar i{ animation:none; } }
</style>
</head>
<body>
<div class="page" id="page">
  <h1>Scan to<br>make your<br>mark</h1>
  <p class="sub" id="sub">Wix is turning 20, and you're part of the story! Take a selfie, and we'll turn it into your very own Wix coin.</p>

  <div id="flow">
    <div class="shot" id="shot">Your face<br>here</div>
    <input id="file" type="file" accept="image/*" capture="user" class="hide">
    <button class="pinkbtn" id="take">Take a selfie</button>
    <button class="pinkbtn hide" id="again">Retake</button>

    <label class="consent" id="consentRow">
      <input type="checkbox" id="consent">
      <span>I agree that my photo and name will be shown on the LED screens at the office and at the Wix 20 event.</span>
    </label>
    <button class="send" id="send">Send to the screen</button>
    <div class="bar" id="bar"><i></i></div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="sent hide" id="sent">
    <p>Sent!<br>Your coin will appear on the screen in a minute or two.</p>
  </div>
</div>
<div class="strip"><div class="run" id="run"></div></div>
<script>
const $=id=>document.getElementById(id);
const FORM_URL='<?= formUrl ?>';
let photo=null;   // jpeg data URL, upright, max 1600 px

// the strip: the design's text and its two icons, written over and over so it loops without a seam
(()=>{ const heart='<svg viewBox="0 0 18.92 16"><path d="M18.92 0H0v16h18.92z" fill="#858B3C"/><path d="M9.42 16C6.22 12.44 0 9.33 0 4.44 0 1.6 2.22 0 4.62 0c2.31 0 3.91 1.42 4.8 3.2C10.3 1.42 11.9 0 14.21 0c2.4 0 4.71 1.6 4.71 4.44 0 4.89-6.22 8-9.5 11.56z" fill="#C9E1FB"/></svg>',
  ovals='<svg viewBox="0 0 14.55 16.48"><path d="M14.55.02H.06v16h14.49z" fill="#1FC76C"/><path d="M3.62 7.39c2 1.25 4.33 1.11 5.22-.3.88-1.42-.02-3.58-2.02-4.83-2-1.25-4.33-1.11-5.22.3-.88 1.42.02 3.58 2.02 4.83zM11.55 12.55c1.52-2.17 1.91-4.53.86-5.26-1.04-.73-3.12.44-4.64 2.61-1.52 2.17-1.91 4.53-.86 5.26 1.05.73 3.12-.44 4.64-2.61z" fill="#3F8CF3"/></svg>';
  const one=['20 Years of Wix Celebration',heart,'2.12.2026',ovals,'17:30',heart,'Hangar 11, Tel Aviv Port',ovals].map(t=>`<span>${t}</span>`).join('');
  $('run').innerHTML=one+one; })();

$('take').onclick=$('again').onclick=()=>{ $('file').value=''; $('file').click(); };
$('consent').onchange=update;
function update(){ if($('msg').classList.contains('err') && photo && $('consent').checked) say(''); }
function say(t, bad, nolink){ const m=$('msg'); m.className='msg'+(bad?' err':''); m.textContent=t;
  if(bad && !nolink && FORM_URL.indexOf('http')===0){ m.append(' '); const a=document.createElement('a'); a.href=FORM_URL; a.textContent='Or upload through the form.'; m.append(a); } }

$('file').onchange=async e=>{
  const f=e.target.files && e.target.files[0]; if(!f) return;
  say('Preparing the photo…');
  try{
    photo=await shrink(f, 1600);
    $('shot').innerHTML=''; const im=new Image(); im.alt='Your selfie'; im.src=photo; $('shot').appendChild(im);
    $('take').classList.add('hide'); $('again').classList.remove('hide'); $('page').classList.add('has');
    say(''); update();
  }catch(err){ photo=null; update(); say('Could not read the photo. Please try again.', true); }
};

async function shrink(file, max){   // the browser applies the phone's rotation flag when decoding
  let src, w, h;
  try{ src=await createImageBitmap(file, {imageOrientation:'from-image'}); w=src.width; h=src.height; }
  catch(_){ src=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=URL.createObjectURL(file); }); w=src.naturalWidth; h=src.naturalHeight; }
  const k=Math.min(1, max/Math.max(w,h)), c=document.createElement('canvas');
  c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.88);
}

function showSent(){ $('bar').style.display='none'; ['flow','sub'].forEach(id=>$(id).classList.add('hide')); $('sent').classList.remove('hide'); }
$('send').onclick=()=>{
  if(!photo) return say('Take a selfie first.', true, true);
  if(!$('consent').checked) return say('Please tick the box to agree.', true, true);
  $('send').disabled=true; $('again').disabled=true; $('bar').style.display='block'; say('Sending…');
  if(!window.google || !google.script){ setTimeout(showSent, 900); return; }   // preview outside Apps Script
  google.script.run
    .withSuccessHandler(showSent)
    .withFailureHandler(err=>{ $('bar').style.display='none'; $('again').disabled=false; update();
      say((err && err.message) || 'Sending failed. Please try again.', true); })
    .saveSelfie(photo, $('consent').checked);
};
</script>
</body>
</html>
